# Leap CRM stage classification, filled from live discovery (Jul 2026):
# stage names as they appear on jobs' current_stage.name (matching is
# case-insensitive and whitespace-trimmed, so trailing spaces in Leap don't matter).
#
# The Leap API exposes no stage-transition history, so the collector
# synthesizes decision events from the job's explicit date fields:
#   contract_signed_date -> pseudo-stage "(contract signed)"  = the SOLD decision
#   completion_date      -> pseudo-stage "(completed)"        = production completed
# Real stages carry class/production roles for lost decisions, backlog, and
# point-in-time production status. Appointment set/run counts come from the
# /appointments endpoint, not stages.
#
# class: open | sold | lost — closing % = sold / (sold + lost) among jobs
# reaching a decision in the week; backlog = sold-not-completed at fetch time.

# Retail vs insurance comes from the job's boolean `insurance` flag; the
# collector normalizes it to these values.
division_field: insurance
division_values:
  retail: ["Retail"]
  insurance: ["Insurance"]

# Lead source lives on the CUSTOMER record (referred_by_type).
source_field: referred_by_type

stages:
  # --- pseudo-stages emitted by the collector from job date fields ---
  - name: "(contract signed)"
    class: sold
    pipeline: contract_signed
  - name: "(completed)"
    class: sold
    production: completed

  # --- real workflow stages (from live jobs sample) ---
  - name: "Lead"
    class: open
  - name: "Scheduled"
    class: open
  - name: "Follow Up"
    class: open
  - name: "Long Term Follow Up"
    class: open
  - name: "Estimating"
    class: open
  - name: "Estimate Complete"
    class: open
  - name: "Estimate Presented / Out"
    class: open
    pipeline: estimate_given
  - name: "Had Damage"
    class: open
  - name: "No Damage"
    class: lost     # terminal: inspected, nothing to sell — confirm with owner
  - name: "EP Sent / Claim Filed"
    class: open
  - name: "Claim Filed"
    class: open
  - name: "In Appraisal"
    class: open
  - name: "Insurance Denied"
    class: lost
  - name: "Claim Approved - Full"
    class: sold
  - name: "Pre-Prod"
    class: sold
    production: started
  - name: "Quality Control"
    class: sold
    production: in_production
  - name: "Job Complete"
    class: sold
    production: completed
  - name: "Invoicing"
    class: sold
    production: completed
  - name: "PIF - Happy"
    class: sold
    production: completed
  - name: "PIF - NH"
    class: sold
    production: completed
  - name: "Paid In Full"    # legacy stage name seen in backfilled history
    class: sold
    production: completed
