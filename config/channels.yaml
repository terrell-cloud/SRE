# Marketing channel spine: maps messy GHL source strings -> canonical channel
# -> QuickBooks sub-account (must match the QB account name exactly).
#
# qb_account: null means an unpaid channel — cost/lead and CAC render as "—".
# Any source string not listed lands in `default_channel` and raises a warning.
#
# FILL FROM DISCOVERY: replace ghl_sources lists with the real source values
# from `python -m kpi discover --source ghl`, and qb_account names with the
# real QuickBooks sub-account names once created.
match: case_insensitive_trim
default_channel: other

channels:
  - key: google
    label: "Google Ads"
    qb_account: "Advertising:Google"
    ghl_sources: ["Google", "Google Ads", "google ads", "GMB", "Google Organic", "LSA"]
  - key: facebook
    label: "Facebook / Instagram"
    qb_account: "Advertising:Facebook"
    ghl_sources: ["Facebook", "fb", "FB Lead Ad", "Instagram", "Meta"]
  - key: door_knocking
    label: "Door Knocking"
    qb_account: null
    ghl_sources: ["Door Knock", "Door Knocking", "canvassing", "Canvass"]
  - key: referral
    label: "Referral"
    qb_account: null
    ghl_sources: ["Referral", "Customer Referral", "Word of Mouth"]
  - key: other
    label: "Other"
    qb_account: null
    ghl_sources: []
